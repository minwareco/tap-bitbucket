name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get latest minware-singer-utils version
      id: get-utils-version
      run: |
        LATEST_COMMIT=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          https://api.github.com/repos/minwareco/minware-singer-utils/commits/main \
          | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")
        echo "UTILS_VERSION=$LATEST_COMMIT" >> $GITHUB_ENV
        echo "Using minware-singer-utils version: $LATEST_COMMIT"
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_FOR_ACTIONS_CHECKOUT }}

    - name: Install dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_FOR_ACTIONS_CHECKOUT }}
        UTILS_VERSION: ${{ env.UTILS_VERSION }}
      run: |
        if [ -z "$UTILS_VERSION" ]; then
          echo "Error: UTILS_VERSION is not set"
          exit 1
        fi
        echo "Installing with UTILS_VERSION=$UTILS_VERSION"
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pytest

    - name: Run unit tests
      run: |
        python -m pytest tests/unittests/ -v --tb=short
